[modules.dang-sdk]
source = "github.com/dagger/dang-sdk@v1.0.1"

[modules.ruby-checks]
source = "./.dagger/modules/e2e"
main = true

[sdks.dang]
module = "dang-sdk"

[sdks.dang.scopes."ruby"]
is-module = true
name = "ruby"

[sdks.dang.scopes."rubocop"]
is-module = true
name = "rubocop"
clients = ["./ruby"]

[sdks.dang.scopes."minitest"]
is-module = true
name = "minitest"
clients = ["./ruby"]

[sdks.dang.scopes."rspec"]
is-module = true
name = "rspec"
clients = ["./ruby"]

[sdks.dang.scopes."rails"]
is-module = true
name = "rails"
clients = ["./ruby"]

[sdks.dang.scopes."bundler-audit"]
is-module = true
name = "bundler-audit"
clients = ["./ruby"]

[sdks.dang.scopes."brakeman"]
is-module = true
name = "brakeman"
clients = ["./ruby"]

[sdks.dang.scopes."sorbet"]
is-module = true
name = "sorbet"
clients = ["./ruby"]

[sdks.dang.scopes."yard"]
is-module = true
name = "yard"
clients = ["./ruby"]

[sdks.dang.scopes."gem"]
is-module = true
name = "gem"
clients = ["./ruby"]

[sdks.dang.scopes.".dagger/modules/e2e"]
is-module = true
name = "e2e"
clients = ["./ruby", "./rubocop", "./minitest", "./rspec", "./rails", "./bundler-audit", "./brakeman", "./sorbet", "./yard", "./gem"]
